[pytest]
pythonpath = .
testpaths = .tests
python_files = Test*.py test_*.py
python_classes = Test*
python_functions = Test* test_*
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto
filterwarnings =
    error
    ignore::DeprecationWarning:lark.*
    ignore::DeprecationWarning:discord.*
